name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP via mise
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Run tests
        run: mise run test
