name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP via mise
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Lint
        run: mise x -- php -l index.php

      - name: Smoke tests
        run: mise x -- php tests/smoke.php

      - name: Unit tests
        run: mise x -- php tests/unit.php
